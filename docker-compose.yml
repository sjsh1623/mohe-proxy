services:
  caddy:
    build: .
    image: caddy-cloudflare:local
    container_name: proxy-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Withy maintenance flag dir. Presence of withy-maintenance.json inside
      # makes Caddy short-circuit /withy/api/health to a static 점검 response
      # (see tossa/scripts/withy-maintenance.sh). Read-only — Caddy never writes.
      - ./maintenance:/srv/maintenance:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy_network

networks:
  proxy_network:
    name: proxy_network
    driver: bridge

volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
